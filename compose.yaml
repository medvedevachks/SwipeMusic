name: swipe-music

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-swipe_music_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - swipe
    # Порт PostgreSQL на хост не публикуется.

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - swipe

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_MIGRATE_USER}:${POSTGRES_MIGRATE_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - swipe

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - swipe
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    environment:
      BACKEND_PROXY_TARGET: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped
    networks:
      - swipe

  migrate-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_MIGRATE_USER}:${POSTGRES_MIGRATE_PASSWORD}@db:5432/${POSTGRES_TEST_DB:-swipe_music_test}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - swipe

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      RUN_DB_TESTS: "true"
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_TEST_DB:-swipe_music_test}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    networks:
      - swipe

  frontend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: test
    networks:
      - swipe

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    environment:
      APP_ORIGIN: http://frontend:5173
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - swipe

volumes:
  postgres_data:

networks:
  swipe:
    driver: bridge
